device:

training:
  bsize_train: 1000
  bsize_val: 1000
  bsize_test: 1000
  grad_clip: 5.0
  n_epochs: 500
  use_amp: false
  s_scale_max: 3.5

model:
  n_layers: 12
  hidden_dims: 128
  s_scale: 1.5
  use_cut_preprocessing: true
  cut_preprocessing_index: [0, 1]
  cut_preprocessing_thresholds: [33.0, 30.0]
  cut_preprocessing_epsilon: 1.0e-6
  use_tail_preprocessing: false
  tail_preprocessing_index: [4]
  tail_preprocessing_type: asinh
  tail_preprocessing_center: [0.0]
  tail_preprocessing_scale: [10]
  tail_preprocessing_epsilon: 1.0e-6

scheduler:
  step_size: 10
  gamma: 0.1
  factor: 0.1
  patience: 10
  threshold: 1.0e-4
  cooldown: 0
  min_lr: 1.0e-6
  eps: 1.0e-8

optimizer:
  lr: 1.0e-4
  eps: 1.1e-8
  weight_decay: 1.0e-5

save:
  save_directory:
