training:
  bsize_train: 2000000
  bsize_val: 2000000
  bsize_test: 30000
  grad_clip: 5.0
  n_epochs: 100
  use_amp: false
  s_scale_max: 5
  patience: 100

optimizer:
  lr: 0.01

scheduler:
  step_size: 5
  gamma: 0.1
  factor: 0.1
  patience: 20
  threshold: 1.0e-4
  cooldown: 0
  min_lr: 1.0e-6
  eps: 1.0e-8
