masks:

  preselection:
    - eta_1 <= 2.1
    - eta_2 <= 2.3
    - pt_1 >= 33
    - pt_2 >= 30
    - (tau_decaymode_2 == 0) | (tau_decaymode_2 == 1) | (tau_decaymode_2 == 10) | (tau_decaymode_2 == 11)

  SR:
    - id_tau_vsJet_Tight_2 > 0.5
    - iso_1 >= 0.0
    - iso_1 < 0.15
    - extramuon_veto < 0.5
    - extraelec_veto < 0.5
    - mt_1 < 70
    - q_1 * q_2 < 0

  AR:
    - id_tau_vsJet_VLoose_2 > 0.5
    - id_tau_vsJet_Tight_2 < 0.5
    - iso_1 >= 0.0
    - iso_1 < 0.15
    - extramuon_veto < 0.5
    - extraelec_veto < 0.5
    - mt_1 < 70
    - q_1 * q_2 < 0

  AR_SS:
    - id_tau_vsJet_VLoose_2 > 0.5
    - id_tau_vsJet_Tight_2 < 0.5
    - iso_1 >= 0.0
    - iso_1 < 0.15
    - extramuon_veto < 0.5
    - extraelec_veto < 0.5
    - mt_1 < 70
    - q_1 * q_2 > 0
  DR_wjets:
    - id_tau_vsJet_VLoose_2 > 0.5
    - nbtag == 0
    - iso_1 >= 0.0
    - iso_1 < 0.15
    - extramuon_veto < 0.5
    - extraelec_veto < 0.5
    - mt_1 > 70
    - q_1 * q_2 < 0

  DR_qcd:
    - id_tau_vsJet_VLoose_2 > 0.5
    - q_1 * q_2 > 0
    - iso_1 > 0.02
    - iso_1 < 0.15
    - extramuon_veto < 0.5
    - extraelec_veto < 0.5
    - mt_1 < 50
  
  AR-like:
    - id_tau_vsJet_VLoose_2 > 0.5
    - id_tau_vsJet_Tight_2 < 0.5

  SR-like:
    - id_tau_vsJet_Tight_2 > 0.5

regions:

  SR:
    - preselection
    - SR

  AR:
    - preselection
    - AR

  AR_SS:
    - preselection
    - AR_SS

  SR_like_wjets:
    - preselection
    - DR_wjets
    - SR-like

  AR_like_wjets:
    - preselection
    - DR_wjets
    - AR-like

  SR_like_qcd:
    - preselection
    - DR_qcd
    - SR-like
  
  AR_like_qcd:
    - preselection
    - DR_qcd
    - AR-like

processes:
  data: process == 0
  wjets: process == 1
  diboson: process.isin([2, 3])
  DYjets: process.isin([4, 5])
  ST: process.isin([6, 7])
  ttbar: process.isin([8, 9])
  embedding: process == 10

  diboson_J: process == 2
  diboson_L: process == 3
  DY_jets_J: process == 4
  DY_jets_L: process == 5
  ST_J: process == 6
  ST_L: process == 7
  ttbar_J: process == 8
  ttbar_L: process == 9
