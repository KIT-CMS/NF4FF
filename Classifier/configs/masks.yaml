masks:

  antiDR:
    - id_tau_vsJet_VLoose_2 > 0.5
    - iso_1 >= 0.0
    - iso_1 < 0.15
    - extramuon_veto < 0.5
    - extraelec_veto < 0.5
    - mt_1 <= 70
    - q_1 * q_2 < 0

  DR_wjets:
    - id_tau_vsJet_VLoose_2 > 0.5
    - nbtag == 0
    - iso_1 >= 0.0
    - iso_1 < 0.15
    - extramuon_veto < 0.5
    - extraelec_veto < 0.5
    - mt_1 > 70

  DR_qcd:
    - id_tau_vsJet_VLoose_2 > 0.5
    - q_1 * q_2 > 0
    - iso_1 > 0.02
    - iso_1 < 0.15
    - extramuon_veto < 0.5
    - extraelec_veto < 0.5
    - mt_1 < 50


  preselection_loose:
    - eta_1 <= 2.1
    - eta_2 <= 2.3
    - pt_1 >= 33
    - pt_2 >= 30
    - (tau_decaymode_2 == 0) | (tau_decaymode_2 == 1) | (tau_decaymode_2 == 10) | (tau_decaymode_2 == 11)

  preselection_tight:
    - eta_1 <= 2.1
    - eta_2 <= 2.3
    - pt_1 >= 33
    - pt_2 >= 30
    - (tau_decaymode_2 == 0) | (tau_decaymode_2 == 1) | (tau_decaymode_2 == 10) | (tau_decaymode_2 == 11)


  SR:
    - id_tau_vsJet_Tight_2 > 0.5

  AR:
    - id_tau_vsJet_VLoose_2 > 0.5
    - id_tau_vsJet_Tight_2 < 0.5
