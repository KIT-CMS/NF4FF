masks:

  preselection:
    - eta_1 <= 2.3
    - eta_2 <= 2.3
    - pt_1 >= 40
    - pt_2 >= 40
    - (tau_decaymode_1 == 0) | (tau_decaymode_1 == 1) | (tau_decaymode_1 == 10) | (tau_decaymode_1 == 11)
    - (tau_decaymode_2 == 0) | (tau_decaymode_2 == 1) | (tau_decaymode_2 == 10) | (tau_decaymode_2 == 11)


  Anti_DR:
    - (q_1*q_2) < 0
    - extramuon_veto < 0.5
    - extraelec_veto < 0.5
    - id_tau_vsJet_VLoose_1 > 0.5
    - id_tau_vsJet_VLoose_2 > 0.5

  DR_qcd:
    - q_1 * q_2 > 0
    - extramuon_veto < 0.5
    - extraelec_veto < 0.5
    - id_tau_vsJet_VLoose_1 > 0.5
    - id_tau_vsJet_VLoose_2 > 0.5


  SR:
    - id_tau_vsJet_Tight_1 > 0.5
    - id_tau_vsJet_Tight_2 > 0.5

  AR1:
    - id_tau_vsJet_Tight_1 < 0.5
    - id_tau_vsJet_Tight_2 > 0.5
  
  AR2:
    - id_tau_vsJet_Tight_2 < 0.5
    - id_tau_vsJet_Tight_1 > 0.5

  AR3:
    - id_tau_vsJet_Tight_1 < 0.5
    - id_tau_vsJet_Tight_2 < 0.5


regions:

  SR:
    - preselection
    - Anti_DR
    - SR

  AR_1:
    - preselection
    - Anti_DR
    - AR1

  AR_2:
    - preselection
    - Anti_DR
    - AR2

  AR_3:
    - preselection
    - Anti_DR
    - AR3

  SR_like:
    - preselection
    - DR_qcd
    - SR
  
  AR_like_1:
    - preselection
    - DR_qcd
    - AR1

  AR_like_2:
    - preselection
    - DR_qcd
    - AR2

  AR_like_3:
    - preselection
    - DR_qcd
    - AR3

  Anti_DR:
    - preselection
    - Anti_DR
  
  DR_qcd:
    - DR_qcd
    - preselection

  preselection:
    - preselection


#identical to data_process_mapping_embedding.yaml in classifier_tt/configs
processes:
  full: process >= 0
  data: process == 0
  diboson: process.isin([1, 2])
  DYjets: process.isin([3, 4])
  embedding: process == 5
  ST: process.isin([6, 7])
  ttbar: process.isin([8, 9])
  wjets: process == 10

  diboson_J: process == 1
  diboson_L: process == 2
  DY_jets_J: process == 3
  DY_jets_L: process == 4
  ST_J: process == 6
  ST_L: process == 7
  ttbar_J: process == 8
  ttbar_L: process == 9

